<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام فيا هورايزن — المالية ومتابعة العقود</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/img/logo-color.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css?v=8">
<link rel="stylesheet" href="assets/css/app.css?v=8">
</head>
<body>

<!-- ===== شاشة الدخول ===== -->
<div id="loginScreen" class="login" hidden>
  <div class="login__box">
    <img src="assets/img/logo-white.png" alt="فيا هورايزن" class="login__logo">
    <h1>نظام فيا هورايزن</h1>
    <p class="login__sub">البوابة المالية · بوابة متابعة العمل والعقود</p>
    <div id="loginPeople" class="login__people"></div>
    <form id="loginForm" class="login__form" autocomplete="off">
      <label for="loginPin">الرقم السري</label>
      <input id="loginPin" type="password" inputmode="numeric" dir="ltr" placeholder="••••" autocomplete="off">
      <p id="loginErr" class="login__err" role="alert"></p>
      <button type="submit" class="btn btn--gold btn--block">دخول</button>
    </form>
    <p class="login__mode" id="loginMode"></p>
  </div>
</div>

<!-- ===== التطبيق ===== -->
<div id="app" class="app" hidden>

  <aside class="side" id="side">
    <div class="side__brand">
      <img src="assets/img/logo-white.png" alt="فيا هورايزن">
    </div>

    <div class="portal" id="portalSwitch">
      <button class="portal__btn" data-portal="f">
        <span class="portal__ico">₪</span>
        <span><b>البوابة المالية</b><small>الفواتير والضريبة والرصيد</small></span>
      </button>
      <button class="portal__btn" data-portal="o">
        <span class="portal__ico">◇</span>
        <span><b>متابعة العمل والعقود</b><small>التفاوض والتنفيذ والمصاريف</small></span>
      </button>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="side__user" id="sideUser"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="القائمة">☰</button>
      <div class="topbar__title">
        <h1 id="pageTitle">—</h1>
        <p id="pageSub"></p>
      </div>
      <div class="topbar__actions" id="pageActions"></div>
    </header>
    <div class="view" id="view"></div>
  </main>

  <div class="side-backdrop" id="sideBackdrop"></div>
</div>

<!-- ===== النوافذ والتنبيهات ===== -->
<div id="modalRoot"></div>
<div id="toastRoot" class="toasts"></div>
<div id="printArea" class="print-area"></div>

<script src="assets/js/config.js?v=8"></script>
<script src="assets/js/utils.js?v=8"></script>
<script src="assets/js/store.js?v=8"></script>
<script src="assets/js/ui.js?v=8"></script>
<script src="assets/js/auth.js?v=8"></script>
<script src="assets/js/ops.js?v=8"></script>
<script src="assets/js/finance.js?v=8"></script>
<script src="assets/js/reports.js?v=8"></script>
<script src="assets/js/app.js?v=8"></script>
</body>
</html>
